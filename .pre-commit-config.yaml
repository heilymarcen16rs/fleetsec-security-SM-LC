# Pre-commit hooks (D. Operación — secrets pre-commit + stage in pipeline).
# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.174.0
    hooks:
      - id: semgrep
        name: semgrep (fleetsec custom rules)
        args: ["--config", "semgrep/fleetsec-rules.yaml", "--error", "--severity", "ERROR",
               "--exclude", "vulnerable.js", "--exclude", "tests"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
